name: SyncSphere CI

on:
  push:
    branches:
      - agentic-development
  pull_request:
    branches:
      - agentic-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build production application
        run: npm run build
