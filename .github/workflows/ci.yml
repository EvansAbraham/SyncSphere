name: SyncSphere CI

on:
  push:
    branches:
      - agentic-development
  pull_request:
    branches:
      - agentic-development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syncsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Synchronize, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          npm_config_fetch_retries: 1
          npm_config_fetch_timeout: 30000

      - name: Install dependencies from synchronized lockfile
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Install Vercel CLI
        if: github.event_name != 'pull_request'
        run: npm install --global vercel@latest

      - name: Link Vercel project for CI
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
        env:
          VERCEL_PROJECT_ID: prj_SCAYwvVgs52MrRNWCbnWjC7A2JUh
          VERCEL_ORG_ID: team_LXWZxdQW4eoyzPERJ7O42iKN

      - name: Pull production build environment from Vercel
        if: github.event_name != 'pull_request'
        run: vercel env pull .env.production.local --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build production application
        if: github.event_name != 'pull_request'
        run: |
          cleanup() { rm -f .env.production.local; }
          trap cleanup EXIT
          npm run build

      - name: Commit lockfile if changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize dependency lockfile"
          git push origin agentic-development
