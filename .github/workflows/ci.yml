name: SyncSphere CI

on:
  push:
    branches:
      - agentic-development
  pull_request:
    branches:
      - agentic-development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syncsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Synchronize, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agentic-development

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          npm_config_fetch_retries: 1
          npm_config_fetch_timeout: 30000

      - name: Install dependencies from synchronized lockfile
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build production application
        run: npm run build

      - name: Commit lockfile if changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize dependency lockfile"
          git push origin agentic-development
