name: SyncSphere CI

on:
  push:
    branches:
      - agentic-development
  pull_request:
    branches:
      - main
    # Only validate PRs originating from the recovery branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint (when ESLint configuration exists)
        shell: bash
        run: |
          if [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yaml ] || [ -f .eslintrc.yml ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npm run lint
          else
            echo "::warning::Lint skipped: repository has no ESLint configuration yet. Add lint configuration during CI foundation work."
          fi

      - name: Run tests (when test script exists)
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "::warning::Tests skipped: no test script is defined yet. Add the test framework and test script before treating CI as a complete quality gate."
          fi

      - name: Build production application
        run: npm run build
