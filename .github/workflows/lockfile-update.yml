name: SyncSphere Lockfile Update

on:
  push:
    branches:
      - agentic-development
    paths:
      - package.json
      - .github/workflows/lockfile-update.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syncsphere-lockfile-update
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agentic-development
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve lockfile with bounded network retries
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          npm_config_fetch_retries: 1
          npm_config_fetch_timeout: 30000

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize dependency lockfile"
          git push origin agentic-development
